<!DOCTYPE html>
<html lang="{{lang}}" data-default-mode="{{defaultMode}}" data-skin="{{skin}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="{{themeColor}}" data-dark="{{themeColor}}" data-light="{{themeColorLight}}">
  <meta name="color-scheme" content="dark light">
{{meta}}
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{brandIcon}}</text></svg>">
  <link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="/feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{fontsUrl}}">
  <link rel="stylesheet" href="/assets/style.css?v={{version}}">
  <script>try{var s=localStorage.getItem('apex-light');if(s!==null)document.documentElement.classList.add(s==='true'?'light':'dark')}catch(e){}</script>
  <script src="/assets/site.js?v={{version}}" defer></script>
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">{{brandIcon}}</span><span class="brand-name">{{siteTitle}}</span></a>
      <nav class="nav" id="mainNav" aria-label="Main">
        <ul>
{{menu}}
        </ul>
      </nav>
      <div class="header-tools">
        <a class="icon-btn" href="/archive.html" title="Search the library" aria-label="Search the library">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></g></svg>
        </a>
        <button id="themeToggle" class="icon-btn theme-toggle" type="button" title="Toggle dark/light mode" aria-label="Toggle dark/light mode">
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></g></svg>
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
        </button>
        <button class="icon-btn menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mainNav">
          <svg class="icon icon-open" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3.5 7h17M3.5 12h17M3.5 17h17"/></svg>
          <svg class="icon icon-close" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="content">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-top">
        <div class="footer-about">
          <a class="brand footer-brand" href="/"><span class="brand-mark" aria-hidden="true">{{brandIcon}}</span><span class="brand-name">{{siteTitle}}</span></a>
          <p class="footer-tagline">{{siteDescription}}</p>
        </div>
        <div class="footer-cols">{{footerLinks}}</div>
      </div>
      <div class="footer-legal">{{footer}}</div>
    </div>
  </footer>
</body>
</html>
