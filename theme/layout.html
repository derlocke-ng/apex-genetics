<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="{{themeColor}}" data-dark="{{themeColor}}" data-light="{{themeColorLight}}">
  <meta name="color-scheme" content="dark light">
{{meta}}
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{brandIcon}}</text></svg>">
  <link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="/feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{fontsUrl}}">
  <link rel="stylesheet" href="/assets/style.css?v={{version}}">
  <script>try{if(localStorage.getItem('apex-light')==='true')document.documentElement.classList.add('light')}catch(e){}</script>
  <script src="/assets/site.js?v={{version}}" defer></script>
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">{{brandIcon}}</span>{{siteTitle}}</a>
      <button class="icon-btn menu-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="mainNav">☰</button>
      <nav class="nav" id="mainNav" aria-label="Main">
        <ul>
{{menu}}
        </ul>
        <button id="themeToggle" class="icon-btn" title="Toggle dark/light mode" aria-label="Toggle dark/light mode">☀️</button>
      </nav>
    </div>
  </header>

  <main id="content">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-info">{{footer}}</div>
      <div class="footer-links">{{footerLinks}}</div>
    </div>
  </footer>
</body>
</html>
